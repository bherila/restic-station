name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # Root package = the headless side (helper executable + Core by path).
      # A Linux-only compile error in Helper/ or Core/ fails here.
      - name: Build helper (root SwiftPM package)
        run: swift build
      - name: Run root package tests
        run: swift test
      - name: Helper lists all subcommands
        run: |
          OUT=$(.build/debug/restic-station-helper --help)
          echo "$OUT"
          # `timer` is Linux-only (T26); the macos job asserts its absence.
          # config/status/sets/runs (T27) are on every platform — the
          # headless CLI surface is identical macOS/Linux by design.
          for sub in tick run-set init-secondary restore probe-repo unlock fda-check secret \
                     config status sets runs timer version; do
            echo "$OUT" | grep -qE "^  $sub( |$)" || { echo "missing subcommand: $sub"; exit 1; }
          done
          # print-password is registered but deliberately hidden: it is the
          # machinery behind RESTIC_PASSWORD_COMMAND, not a user action.
          if echo "$OUT" | grep -qE "^  print-password( |$)"; then
            echo "print-password must not appear in --help"
            exit 1
          fi
          # …hidden, but reachable.
          .build/debug/restic-station-helper print-password --help >/dev/null
          .build/debug/restic-station-helper secret --help
      # SwiftPM does not run a path dependency's test targets, so Core's
      # suite still needs its own invocation.
      - name: Run Core unit tests
        run: swift test --package-path Core
      # The Linux secret backend, end to end against the real binary. restic
      # is not installed in this container, so the script skips its restic
      # half (T29 owns the Linux restic matrix) and still asserts the file
      # modes, the exact print-password bytes, and that `secret list` prints
      # no secret value.
      - name: Secret CLI + FileSecretStore end to end
        run: scripts/secret-cli-test.sh

      # `--json` output is asserted by piping through jq; the Swift image
      # does not ship it. Best-effort, matching the systemd install step
      # below — if apt cannot provide it, fail loudly with a clear cause
      # rather than a confusing "jq: command not found" mid-script.
      - name: Install jq (for --json assertions)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends jq
          fi
          jq --version
      # T27 — headless CLI ergonomics (config export/import/validate/show,
      # status, sets list, runs list/show): end to end against the real
      # binary. restic is not installed in this container, so the script
      # skips its real-backup half and still covers every other assertion,
      # including the anti-silent-failure `config validate` report and the
      # full-suite secret-leak grep.
      - name: Headless CLI (config/status/sets/runs) end to end
        run: scripts/headless-cli-test.sh

      # T25 acceptance criteria that only a real Linux run can show.
      - name: fda-check is a no-op on Linux
        run: |
          export RESTIC_STATION_DATA_DIR=$(mktemp -d)
          OUT=$(.build/debug/restic-station-helper fda-check)
          echo "$OUT"
          echo "$OUT" | grep -q "not applicable on this platform"
          # A fake "granted" record would make the file's meaning
          # platform-dependent — nothing may be written at all.
          test ! -e "$RESTIC_STATION_DATA_DIR/state/fda-check.json"

      - name: restic discovery resolves the helper's binary on Linux
        run: |
          export RESTIC_STATION_DATA_DIR=$(mktemp -d)
          mkdir -p "$RESTIC_STATION_DATA_DIR"
          # No resticPath configured and no sets: enough to exercise
          # HelperContext.make()'s resolution, which runs before anything else.
          echo '{"version":1,"resticPath":null,"showMenuBarIcon":true,"sets":[]}' \
            > "$RESTIC_STATION_DATA_DIR/config.json"
          UUID=00000000-0000-0000-0000-000000000001

          # 1. Nothing installed anywhere: an actionable message, not "open
          #    Restic Station".
          OUT=$(env PATH=/nonexistent .build/debug/restic-station-helper \
            probe-repo --set $UUID --dest $UUID 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "restic not found"
          echo "$OUT" | grep -q "/usr/bin/restic"
          # machine.json, not config.json: a binary path is per-machine, and
          # config.json is the file that is shared between hosts (T24).
          echo "$OUT" | grep -q "$RESTIC_STATION_DATA_DIR/machine.json"
          # "open Restic Station" is impossible advice on a headless host.
          ! echo "$OUT" | grep -q "open Restic Station"

          # The v1 config written above was migrated in place by that first
          # load: version bumped, backup taken verbatim, machine identity
          # created (T24). grep rather than jq — the Swift container has no
          # jq, and the JSON separator spacing differs between platforms.
          grep -qE '"version"[[:space:]]*:[[:space:]]*2' "$RESTIC_STATION_DATA_DIR/config.json"
          grep -qE '"version"[[:space:]]*:[[:space:]]*1' "$RESTIC_STATION_DATA_DIR/config.v1.backup.json"
          grep -qE '"machineId"[[:space:]]*:[[:space:]]*"[a-z0-9-]+"' "$RESTIC_STATION_DATA_DIR/machine.json"

          # 2. A restic on PATH is discovered and used, with no configuration
          #    at all — the "headless host" acceptance criterion. Note it is
          #    only "found" because it *runs*: an inert +x file would not do.
          FAKEBIN=$(mktemp -d)
          cat > "$FAKEBIN/restic" <<'SH'
          #!/bin/sh
          if [ "$1" = "version" ]; then
            echo '{"version":"0.18.1","go_version":"go1.22.0","go_os":"linux","go_arch":"arm64"}'
            exit 0
          fi
          exit 1
          SH
          chmod +x "$FAKEBIN/restic"
          OUT=$(env PATH="$FAKEBIN" .build/debug/restic-station-helper \
            probe-repo --set $UUID --dest $UUID 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "discovered $FAKEBIN/restic"
          # Got past restic resolution and on to the real (absent) set.
          echo "$OUT" | grep -q "no backup set with id"

          # 3. tick still exits 0 on a host with nothing configured.
          #    (tick resolves restic through the same `resolveResticPath`
          #    that step 2 exercises, via `makeTolerant`.)
          env PATH="$FAKEBIN" .build/debug/restic-station-helper tick

      # T26 acceptance criteria reachable without a live systemd. This
      # container is NOT booted with systemd (`/run/systemd/system` is
      # absent), which makes it the perfect host for the "no systemd" paths —
      # the ones a developer's Mac cannot exercise at all.
      - name: timer install refuses cleanly on a host without systemd
        run: |
          export HOME=$(mktemp -d)
          export XDG_CONFIG_HOME="$HOME/.config"
          OUT=$(.build/debug/restic-station-helper timer install 2>&1) && {
            echo "$OUT"; echo "expected timer install to fail without systemd"; exit 1
          }
          echo "$OUT"
          echo "$OUT" | grep -q "systemd is not available"
          echo "$OUT" | grep -q "crontab -e"
          echo "$OUT" | grep -qE '\*/2 \* \* \* \* .*restic-station-helper tick'
          # A confusing `systemctl: command not found` is exactly what this
          # detection exists to prevent.
          ! echo "$OUT" | grep -q "command not found"
          # Nothing written on a host that would never act on it.
          test ! -e "$XDG_CONFIG_HOME/systemd/user/restic-station.timer"

      - name: timer status and uninstall are safe with nothing installed
        run: |
          export HOME=$(mktemp -d)
          export RESTIC_STATION_DATA_DIR=$(mktemp -d)
          # status exits 1 when scheduled backups will NOT happen.
          OUT=$(.build/debug/restic-station-helper timer status 2>&1) && {
            echo "$OUT"; echo "expected timer status to exit non-zero"; exit 1
          }
          echo "$OUT"
          echo "$OUT" | grep -q "systemd     not available"
          # uninstall is idempotent: exit 0 when nothing is installed.
          .build/debug/restic-station-helper timer uninstall

      - name: Rendered systemd units parse
        run: |
          # The Swift image does not ship systemd; install just the tooling if
          # the archives allow it. If it cannot be had, say so loudly rather
          # than pretending the units were verified.
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            apt-get update -qq \
              && apt-get install -y -qq --no-install-recommends systemd \
              || echo "apt could not install systemd"
          fi
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            echo "::warning::systemd-analyze unavailable in this container — units NOT parse-verified"
            exit 0
          fi
          systemd-analyze --version
          WORK=$(mktemp -d)
          # `systemd-analyze --user` spins up a throwaway user manager to
          # resolve specifiers, and that needs a runtime directory; without
          # one it dies with "Failed to initialize manager".
          export XDG_RUNTIME_DIR=$(mktemp -d)
          # `<HELPER_PATH>` is a placeholder, and `verify` checks that the
          # ExecStart binary exists; /bin/true stands in for the helper.
          sed 's|<HELPER_PATH>|/bin/true|' \
            packaging/linux/systemd/restic-station.service > "$WORK/restic-station.service"
          cp packaging/linux/systemd/restic-station.timer "$WORK/restic-station.timer"
          # `verify` exits 0 even for a directive it could not parse (it just
          # says "ignoring"), so the exit code alone would let a malformed
          # unit through. Gate on the diagnostics instead, discarding only the
          # one benign complaint this container always makes.
          verify() {
            systemd-analyze --user verify "$@" 2>&1 \
              | grep -v "Failed to connect to system bus" || true
          }

          # The units a unit test already pins as byte-identical to what
          # `timer install` writes, so verifying these verifies both.
          OUT=$(verify "$WORK/restic-station.service" "$WORK/restic-station.timer")
          if [ -n "$OUT" ]; then
            echo "$OUT"
            echo "systemd-analyze reported problems with the shipped units"
            exit 1
          fi
          echo "shipped units verified clean"

          # Negative control: silence is also what a check that did nothing at
          # all looks like, so prove the verifier still has teeth on this host.
          BAD=$(printf '[Service]\nType=definitely-not-a-type\nExecStart=/bin/true\n' \
            > "$WORK/broken.service"; verify "$WORK/broken.service")
          if [ -z "$BAD" ]; then
            echo "systemd-analyze said nothing about a deliberately invalid unit —"
            echo "the clean result above therefore proves nothing"
            exit 1
          fi
          echo "negative control OK: $BAD"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen restic jq
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -scheme "Restic Station" build CODE_SIGNING_ALLOWED=NO -derivedDataPath dd
      - name: Verify bundle layout
        run: |
          APP="dd/Build/Products/Debug/Restic Station.app"
          test -x "$APP/Contents/MacOS/restic-station-helper"
          plutil -lint "$APP/Contents/Library/LaunchAgents/net.herila.ResticStation.helper.plist"
          OUT=$("$APP/Contents/MacOS/restic-station-helper" version)
          echo "$OUT" | grep -q "restic-station-helper 0.1.0"
      # T26: `timer` is Linux-only. A subcommand that exists on macOS and
      # always errors would be a worse --help than one that is honestly absent.
      - name: timer is absent from --help on macOS
        run: |
          APP="dd/Build/Products/Debug/Restic Station.app"
          OUT=$("$APP/Contents/MacOS/restic-station-helper" --help)
          echo "$OUT"
          ! echo "$OUT" | grep -qE "^  timer( |$)"
          ! "$APP/Contents/MacOS/restic-station-helper" timer status 2>/dev/null
          # T27: the headless CLI surface is identical on macOS and Linux —
          # present here too, not just registered on the Linux side.
          for sub in config status sets runs; do
            echo "$OUT" | grep -qE "^  $sub( |$)" || { echo "missing subcommand: $sub"; exit 1; }
          done
      - name: Run Core unit tests
        run: swift test --package-path Core
      - name: Run integration test
        run: scripts/integration-test.sh
      # Forces the Linux file backend on macOS, where restic IS installed —
      # so this run also proves the acceptance criterion "restic
      # authenticates via RESTIC_PASSWORD_COMMAND against FileSecretStore",
      # against the helper inside the real app bundle.
      - name: Secret CLI + FileSecretStore end to end (file backend on macOS)
        run: scripts/secret-cli-test.sh "dd/Build/Products/Debug/Restic Station.app/Contents/MacOS/restic-station-helper"
      # T27 — headless CLI ergonomics, against the real app-bundled helper.
      # restic and jq are both installed on this runner, so this also
      # exercises the real-backup half (secret set → run-set → status
      # reflects it) that the Linux job cannot.
      - name: Headless CLI (config/status/sets/runs) end to end
        run: scripts/headless-cli-test.sh "dd/Build/Products/Debug/Restic Station.app/Contents/MacOS/restic-station-helper"
      - name: Ad-hoc sign and package app artifact
        run: |
          APP="dd/Build/Products/Debug/Restic Station.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Restic-Station.zip"
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Restic-Station-app
          path: Restic-Station.zip
          retention-days: 14

  # T29 (issue #31): builds a fully static restic-station-helper for both
  # Linux architectures (Apple's Static Linux SDK, musl — see
  # scripts/setup-static-linux-sdk.sh for the pinned toolchain/SDK version)
  # and packages each with scripts/package-linux.sh. Runs on macOS — the
  # cross-compile host verified locally — but downloads its own pinned
  # open-source Swift toolchain rather than relying on whatever Xcode ships,
  # which is what makes the build reproducible independent of the runner
  # image's Xcode version.
  release-linux:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # ~1.7 GB of downloads (toolchain .pkg + static SDK bundle); cached by
      # the exact pinned version so a green run only pays for this once.
      - name: Cache Static Linux SDK toolchain
        uses: actions/cache@v4
        with:
          path: .build/static-linux-sdk-cache
          key: static-linux-sdk-${{ hashFiles('scripts/setup-static-linux-sdk.sh') }}
      - name: Build + package both architectures
        run: scripts/package-linux.sh x86_64 aarch64
      - name: Verify SHA256SUMS
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
      - name: Verify tarball layout is inspectable by hand
        run: |
          for arch in x86_64 aarch64; do
            echo "--- restic-station-linux-$arch.tar.gz ---"
            tar tzf "dist/restic-station-linux-$arch.tar.gz"
            for f in restic-station-helper install.sh README.md LICENSE \
                     systemd/restic-station.service systemd/restic-station.timer; do
              tar tzf "dist/restic-station-linux-$arch.tar.gz" | grep -qF "restic-station-linux-$arch/$f" \
                || { echo "missing $f in $arch tarball"; exit 1; }
            done
          done
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restic-station-linux
          path: |
            dist/restic-station-linux-x86_64.tar.gz
            dist/restic-station-linux-aarch64.tar.gz
            dist/SHA256SUMS
          retention-days: 14

  # T29: the Linux integration test (scripts/integration-test.sh's
  # assert_fixture_flow — mac-exported config import, secret set via stdin,
  # backup + mirror via restic copy, config validate/status --json excluding
  # a set disabled for this machine) against the STATIC release binary, on a
  # real (non-container) Ubuntu VM with real restic installed — proving
  # T23's "RESTIC_PASSWORD_COMMAND against FileSecretStore on Linux"
  # acceptance criterion, which the swift:6.1-container `linux` job above
  # cannot (no restic there). aarch64, matching this runner natively — no
  # QEMU needed.
  linux-integration:
    needs: release-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: restic-station-linux
          path: dist
      # NOT `apt-get install restic`: Ubuntu 24.04 LTS ships restic 0.16.4,
      # below the 0.17.0 minimum in docs/restic-cli.md §version that
      # ResticDiscovery enforces. The apt build is fine for the scenarios
      # that pin `resticPath` in config.json (an explicit path bypasses the
      # version gate), but the T29 fixture flow imports a Mac-authored config
      # with `resticPath: null` and therefore exercises real discovery — which
      # correctly rejects 0.16.4 and reports "restic not found". Install the
      # official release so CI tests the version a user is told to run.
      - name: Install restic + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq bzip2
          curl -fsSL -o /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_${RESTIC_ARCH}.bz2"
          bunzip2 -f /tmp/restic.bz2
          sudo install -m 0755 /tmp/restic /usr/bin/restic
          restic version
        env:
          RESTIC_VERSION: 0.18.1
          RESTIC_ARCH: arm64
      - name: Unpack the aarch64 tarball
        run: tar xzf dist/restic-station-linux-aarch64.tar.gz -C dist
      - name: ldd confirms no dynamic dependencies
        run: |
          BIN=dist/restic-station-linux-aarch64/restic-station-helper
          chmod +x "$BIN"
          OUT=$(ldd "$BIN" 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "not a dynamic executable" \
            || { echo "expected ldd to report a static binary"; exit 1; }
      - name: install.sh works unprivileged, is idempotent, warns off-PATH
        run: |
          cd dist/restic-station-linux-aarch64
          PREFIX="$RUNNER_TEMP/install-test-bin"
          OUT1=$(./install.sh --prefix="$PREFIX")
          echo "$OUT1"
          echo "$OUT1" | grep -q "WARNING:.*not on your PATH" \
            || { echo "expected the off-PATH warning"; exit 1; }
          test -x "$PREFIX/restic-station-helper"
          # idempotent: a second run overwrites cleanly, no error.
          ./install.sh --prefix="$PREFIX"
          # on-PATH: no warning this time.
          OUT2=$(PATH="$PREFIX:$PATH" ./install.sh --prefix="$PREFIX")
          echo "$OUT2"
          if echo "$OUT2" | grep -q "WARNING:.*not on your PATH"; then
            echo "warned even though the prefix was on PATH"; exit 1
          fi
      - name: Run the Linux integration test against the STATIC binary
        run: |
          RESTIC_STATION_HELPER_OVERRIDE="$PWD/dist/restic-station-linux-aarch64/restic-station-helper" \
            scripts/integration-test.sh
      # T26 verification debt (deferred by an earlier task): a real systemd
      # --user timer end to end. This runner is a bare VM (systemd IS pid 1,
      # unlike the swift:6.1 container above) — worth an honest attempt
      # rather than assuming it is still blocked. Never fails the job:
      # whatever happens here is diagnostic, reported in the PR, and the
      # `linux` job's own no-systemd-container coverage is unaffected either
      # way.
      - name: T26 diagnostic — does timer install work on a bare Actions VM?
        continue-on-error: true
        run: |
          BIN="$PWD/dist/restic-station-linux-aarch64/restic-station-helper"
          export RESTIC_STATION_DATA_DIR=$(mktemp -d)
          echo '{"version":2,"resticPath":null,"showMenuBarIcon":true,"sets":[]}' \
            > "$RESTIC_STATION_DATA_DIR/config.json"
          "$BIN" timer install || true
          "$BIN" timer status || true
          systemctl --user status 2>&1 || true
          loginctl show-user "$(whoami)" 2>&1 || true

      # T30 (issue #32): docs/linux.md prints real terminal transcripts, not
      # paraphrases — this is the only real (non-container) Linux host with
      # real restic this project's CI has. scripts/linux-docs-transcript.sh
      # runs the exact commands docs/linux.md quotes against the STATIC
      # release binary and echoes each one before running it, so this step's
      # log IS the source for every transcript in that doc: if a command's
      # output ever changes, this step's log changes with it. jq was
      # installed by the "Install restic + jq" step above.
      - name: Docs transcript for docs/linux.md
        run: |
          scripts/linux-docs-transcript.sh \
            "$PWD/dist/restic-station-linux-aarch64/restic-station-helper"

  # T29: proves the release binary is genuinely static — not just built with
  # a static-looking flag — by running it in the three environments issue
  # #31 names. Full three-environment sweep on x86_64 (broadest image
  # availability, incl. a deliberately old-glibc distro); aarch64 gets the
  # two cheap/native-multi-arch checks. See the PR description for which of
  # the three this covers per architecture and why.
  linux-runtime-verify:
    needs: release-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: restic-station-linux
          path: dist
      - name: Unpack
        run: |
          tar xzf "dist/restic-station-linux-${{ matrix.arch }}.tar.gz" -C dist
          chmod +x "dist/restic-station-linux-${{ matrix.arch }}/restic-station-helper"
      - name: ldd confirms no dynamic dependencies
        run: |
          OUT=$(ldd "dist/restic-station-linux-${{ matrix.arch }}/restic-station-helper" 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "not a dynamic executable" \
            || { echo "expected ldd to report a static binary"; exit 1; }
      - name: Runs in a scratch container (no libc, no userland at all)
        run: |
          WORK=$(mktemp -d)
          cp "dist/restic-station-linux-${{ matrix.arch }}/restic-station-helper" "$WORK/"
          printf 'FROM scratch\nCOPY restic-station-helper /restic-station-helper\nENTRYPOINT ["/restic-station-helper"]\n' \
            > "$WORK/Dockerfile"
          docker build -t rs-scratch-test "$WORK"
          OUT=$(docker run --rm rs-scratch-test version)
          echo "$OUT"
          echo "$OUT" | grep -q "restic-station-helper 0.1.0"
      - name: Runs on Alpine (musl userland — the SDK's own libc family)
        run: |
          docker run --rm \
            -v "$PWD/dist/restic-station-linux-${{ matrix.arch }}:/work" \
            alpine:3.19 /work/restic-station-helper version | tee /tmp/out.txt
          grep -q "restic-station-helper 0.1.0" /tmp/out.txt
      - name: Runs on Debian 12 Bookworm (glibc userland — proves no glibc need)
        run: |
          docker run --rm \
            -v "$PWD/dist/restic-station-linux-${{ matrix.arch }}:/work" \
            debian:12-slim /work/restic-station-helper version | tee /tmp/out.txt
          grep -q "restic-station-helper 0.1.0" /tmp/out.txt
      # Deliberately old glibc (CentOS 7: glibc 2.17, released 2012) — the
      # point is that this must work identically to the two checks above
      # *because* the binary carries no glibc dependency at all, static or
      # dynamic. Only attempted on x86_64: CentOS 7 predates official arm64
      # image builds, and this task's own instructions are explicit that a
      # environment which cannot be exercised in Actions should be marked
      # deferred rather than faked — so aarch64 is left there, honestly,
      # not silently skipped.
      - name: Runs on a deliberately old-glibc distro (CentOS 7, x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm \
            -v "$PWD/dist/restic-station-linux-${{ matrix.arch }}:/work" \
            centos:7 /work/restic-station-helper version | tee /tmp/out.txt
          grep -q "restic-station-helper 0.1.0" /tmp/out.txt
