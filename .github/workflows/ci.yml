name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # Root package = the headless side (helper executable + Core by path).
      # A Linux-only compile error in Helper/ or Core/ fails here.
      - name: Build helper (root SwiftPM package)
        run: swift build
      - name: Run root package tests
        run: swift test
      - name: Helper lists all subcommands
        run: |
          OUT=$(.build/debug/restic-station-helper --help)
          echo "$OUT"
          for sub in tick run-set init-secondary restore probe-repo unlock fda-check version; do
            echo "$OUT" | grep -qE "^  $sub( |$)" || { echo "missing subcommand: $sub"; exit 1; }
          done
      # SwiftPM does not run a path dependency's test targets, so Core's
      # suite still needs its own invocation.
      - name: Run Core unit tests
        run: swift test --package-path Core

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen restic jq
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -scheme "Restic Station" build CODE_SIGNING_ALLOWED=NO -derivedDataPath dd
      - name: Verify bundle layout
        run: |
          APP="dd/Build/Products/Debug/Restic Station.app"
          test -x "$APP/Contents/MacOS/restic-station-helper"
          plutil -lint "$APP/Contents/Library/LaunchAgents/net.herila.ResticStation.helper.plist"
          OUT=$("$APP/Contents/MacOS/restic-station-helper" version)
          echo "$OUT" | grep -q "restic-station-helper 0.1.0"
      - name: Run Core unit tests
        run: swift test --package-path Core
      - name: Run integration test
        run: scripts/integration-test.sh
      - name: Ad-hoc sign and package app artifact
        run: |
          APP="dd/Build/Products/Debug/Restic Station.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Restic-Station.zip"
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Restic-Station-app
          path: Restic-Station.zip
          retention-days: 14
